name: Deploy portfolio and refresh writing

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh Medium writing (retains curated articles if unavailable)
        run: python scripts/update_medium.py
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html styles.css main.js robots.txt sitemap.xml _site/
          cp -R assets _site/assets
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
